name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        # Settings live in release-please-config.json (first release: 0.1.0).

  # Publishing to luarocks.org is off for now (no API key). To turn it on: add a
  # LUX_API_KEY secret and restore the `luarocks` job from git history
  # (lumen-oss/luarocks-tag-release, run in this workflow after release-please).
