name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        # Settings live in release-please-config.json (first release: 0.1.0).

  # In this workflow (not on a tag push): tags created with GITHUB_TOKEN
  # don't trigger other workflows.
  luarocks:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: lumen-oss/luarocks-tag-release@v9
        env:
          LUX_API_KEY: ${{ secrets.LUX_API_KEY }}
        with:
          version: ${{ needs.release-please.outputs.tag_name }}
          # Not read from our rockspec: the action generates its own.
          dependencies: |
            oil.nvim
